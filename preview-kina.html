<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kina - Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(160deg, #06030f, #0d0825, #120c33);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
}

.banner-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 10000;
}

.banner {
    background: linear-gradient(160deg, #10b981, #34d399, #059669);
    color: #0b091a;
    padding: 40px 50px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 60px rgba(16,185,129,0.3);
    max-width: 480px;
    width: 90%;
    position: relative;
    overflow: hidden;
    animation: pulse 1.5s ease-in-out infinite;
}

.banner::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    background: conic-gradient(from 0deg, #10b981, #34d399, #059669, #10b981);
    z-index: -1;
    animation: borderSpin 3s linear infinite;
}

.banner::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 26px;
    background: linear-gradient(160deg, #10b981, #34d399, #059669);
    z-index: -1;
}

.icon {
    font-size: 3.5em;
    margin-bottom: 8px;
    animation: bounce 1s ease-in-out infinite;
}

.title {
    font-size: 3.5em;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    animation: glow 2s ease-in-out infinite;
}

.subtitle {
    font-size: 1.2em;
    font-weight: 600;
    margin-top: 6px;
    opacity: 0.85;
}

.value {
    font-size: 2.8em;
    font-weight: 900;
    margin: 14px 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.08);
}

.winner {
    font-size: 1.1em;
    font-weight: 500;
    opacity: 0.8;
    margin-bottom: 16px;
}

@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.015)} }
@keyframes borderSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes glow {
    0%,100%{text-shadow:0 4px 20px rgba(0,0,0,0.12)}
    50%{text-shadow:0 4px 40px rgba(0,0,0,0.2),0 0 50px rgba(16,185,129,0.3)}
}

.particle {
    position: fixed;
    pointer-events: none;
    z-index: 10001;
    animation: float ease-out forwards;
    font-size: 1.4em;
}

@keyframes float {
    0%{transform:translateY(0) rotate(0deg) scale(0);opacity:1}
    50%{transform:translateY(-40vh) rotate(180deg) scale(1.2);opacity:0.7}
    100%{transform:translateY(-80vh) rotate(360deg) scale(0);opacity:0}
}

@media (max-width: 480px) {
    .banner { padding: 28px 20px; border-radius: 20px; }
    .icon { font-size: 2.8em; }
    .title { font-size: 2.6em; letter-spacing: 3px; }
    .value { font-size: 2em; }
}
</style>
</head>
<body>

<div class="banner-overlay">
    <div class="banner">
        <div class="icon">⭐</div>
        <div class="title">KINA!</div>
        <div class="subtitle">5 Números em Linha</div>
        <div class="value">R$ 10.000</div>
        <div class="winner">🎉 PARABÉNS! 🎉</div>
    </div>
</div>

<script>
function createParticles() {
    const chars = ['⭐', '✨', '✦'];
    for (let i = 0; i < 22; i++) {
        setTimeout(() => {
            const p = document.createElement('div');
            p.className = 'particle';
            p.textContent = chars[Math.floor(Math.random() * chars.length)];
            p.style.left = (5 + Math.random() * 90) + '%';
            p.style.bottom = '0';
            p.style.fontSize = (1 + Math.random() * 1.5) + 'em';
            p.style.animationDuration = (2 + Math.random() * 2) + 's';
            p.style.animationDelay = (Math.random() * 0.3) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 5000);
        }, i * 100);
    }
}

window.onload = createParticles;
setInterval(createParticles, 5000);
</script>
</body>
</html>
