<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO VIP CLUB - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/index.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(to bottom, rgb(106, 121, 255), rgb(0, 3, 152), rgb(0, 3, 152));
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        ::selection { background: rgba(255, 183, 50, 0.3); color: #fff; }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 1em;
            outline: none;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 15px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .input-field:focus {
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.08);
        }

        .input-field::placeholder { color: rgba(255,255,255,0.2); }

        .box {
            background: linear-gradient(to bottom, rgb(0, 3, 182), rgb(0, 2, 113));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 44px 38px;
            text-align: center;
            border: 1px solid rgb(106, 121, 255);
            box-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 60px rgba(106, 121, 255, 0.05);
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(251, 191, 36, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .box h1 {
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffff00, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 28px;
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .auth-field { text-align: left; }

        .auth-field label {
            display: block;
            font-size: 0.85em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .auth-error {
            color: #ef4444;
            font-size: 0.85em;
            margin: 6px 0;
            display: block;
            min-height: 20px;
        }

        .mode-btn {
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mode-btn:hover {
            border-color: rgba(251, 191, 36, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .mode-btn:hover::before { opacity: 1; }
        .mode-btn:active { transform: translateY(0); }

        .mode-btn .icon { font-size: 1.6em; position: relative; z-index: 1; }
        .mode-btn .title { display: block; font-weight: 700; font-size: 0.95em; position: relative; z-index: 1; }
        .mode-btn .desc { display: block; font-size: 0.78em; color: rgba(255,255,255,0.7); font-weight: 400; position: relative; z-index: 1; }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast-item {
            background: rgba(15,12,40,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 20px;
            color: #ffffff;
            font-size: 0.9em;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 360px;
            pointer-events: auto;
        }
        .toast-item.visible { transform: translateX(0); }
        .toast-item.toast-success { border-left: 3px solid #10b981; }
        .toast-item.toast-error { border-left: 3px solid #ef4444; }
        .toast-item.toast-info { border-left: 3px solid #3b82f6; }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .box { padding: 24px 18px; border-radius: 20px; }
            .box h1 { font-size: 1.6em; }
            .subtitle { font-size: 0.9em; margin-bottom: 20px; letter-spacing: 1.5px; }
            .mode-btn { padding: 14px 16px; gap: 10px; }
            .mode-btn .title { font-size: 1.1em; }
            .mode-btn .desc { font-size: 0.9em; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="box">
        <h1>🎱 BINGO VIP CLUB</h1>
        <p class="subtitle">Kuadra • Kina • Keno</p>

        <!-- LOGIN -->
        <div id="authLogin">
            <div class="auth-field">
                <label>CPF:</label>
                <input type="text" id="loginCpf" class="input-field" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
            </div>
            <div class="auth-field">
                <label>Senha:</label>
                <input type="password" id="loginSenha" class="input-field" placeholder="Sua senha">
            </div>
            <p class="auth-error" id="loginError"></p>
            <button class="mode-btn" onclick="fazerLogin()" style="width:100%">
                <span class="icon">🔑</span>
                <span class="text">
                    <span class="title">Entrar</span>
                    <span class="desc">Acessar minha conta</span>
                </span>
            </button>
            <p style="margin-top:16px;font-size:0.85em;color:#6b6599">
                Não tem conta? <a href="#" onclick="mostrarAba('register');return false" style="color:#fbbf24;text-decoration:none;font-weight:600">Cadastre-se</a>
            </p>
        </div>

        <!-- CADASTRO -->
        <div id="authRegister" style="display:none">
            <div class="auth-field">
                <label>Nome Completo:</label>
                <input type="text" id="regNome" class="input-field" placeholder="Seu nome completo" autocomplete="off">
            </div>
            <div class="auth-field">
                <label>CPF:</label>
                <input type="text" id="regCpf" class="input-field" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
            </div>
            <div class="auth-field">
                <label>E-mail:</label>
                <input type="email" id="regEmail" class="input-field" placeholder="seu@email.com" autocomplete="off">
            </div>
            <div class="auth-field">
                <label>Senha:</label>
                <input type="password" id="regSenha" class="input-field" placeholder="Mínimo 4 caracteres">
            </div>
            <div class="auth-field">
                <label>Confirmar Senha:</label>
                <input type="password" id="regConfirma" class="input-field" placeholder="Repita a senha">
            </div>
            <div class="auth-field">
                <label>Chave PIX (para saque):</label>
                <input type="text" id="regChavePix" class="input-field" placeholder="CPF, e-mail, telefone ou chave aleatória">
            </div>
            <p class="auth-error" id="regError"></p>
            <button class="mode-btn" onclick="registrar()" style="width:100%">
                <span class="icon">✅</span>
                <span class="text">
                    <span class="title">Cadastrar</span>
                    <span class="desc">Criar minha conta</span>
                </span>
            </button>
            <p style="margin-top:16px;font-size:0.85em;color:#6b6599">
                Já tem conta? <a href="#" onclick="mostrarAba('login');return false" style="color:#fbbf24;text-decoration:none;font-weight:600">Faça login</a>
            </p>
        </div>

        <div class="spectator-entry">
            <button class="mode-btn" onclick="conectarComoEspectador()" style="width:100%;margin-top:8px">
                <span class="icon">👁️</span>
                <span class="text">
                    <span class="title">Assistir ao Vivo</span>
                    <span class="desc">Acompanhe o sorteio sem fazer login</span>
                </span>
            </button>
        </div>
    </div>

    <script>
        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            input.value = v;
        }

        function validarCPF(cpf) {
            const nums = cpf.replace(/\D/g, '');
            if (nums.length !== 11) return false;
            if (/^(\d)\1{10}$/.test(nums)) return false;
            let sum = 0;
            for (let i = 0; i < 9; i++) sum += parseInt(nums[i]) * (10 - i);
            let dig1 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
            if (parseInt(nums[9]) !== dig1) return false;
            sum = 0;
            for (let i = 0; i < 10; i++) sum += parseInt(nums[i]) * (11 - i);
            let dig2 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
            if (parseInt(nums[10]) !== dig2) return false;
            return true;
        }

        function mostrarAba(aba) {
            document.getElementById('authRegister').style.display = aba === 'register' ? 'block' : 'none';
            document.getElementById('authLogin').style.display = aba === 'login' ? 'block' : 'none';
            document.getElementById('regError').textContent = '';
            document.getElementById('loginError').textContent = '';
        }

        function showToast(message, type, duration) {
            type = type || 'info';
            duration = duration || 3000;
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast-item toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(function() { toast.classList.add('visible'); });
            setTimeout(function() {
                toast.classList.remove('visible');
                setTimeout(function() { toast.remove(); }, 400);
            }, duration);
        }

        function fazerLogin() {
            var cpf = document.getElementById('loginCpf').value.trim().replace(/\D/g, '');
            var senha = document.getElementById('loginSenha').value.trim();
            var errEl = document.getElementById('loginError');

            if (!cpf || !senha) {
                errEl.textContent = 'Preencha CPF e senha.';
                return;
            }

            fetch((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : 'https://bingo-master-pro-fcty.onrender.com') + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cpf: cpf, senha: senha })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.error) {
                    errEl.textContent = data.error;
                    return;
                }
                localStorage.setItem('bingo_session_token', data.sessionToken);
                localStorage.setItem('bingo_meu_cpf', data.cpf);
                localStorage.setItem('bingo_last_name', data.nome);
                showToast('Login realizado com sucesso!', 'success');
                errEl.textContent = '';
                setTimeout(function() { window.location.href = 'index.html'; }, 500);
            })
            .catch(function() {
                errEl.textContent = 'Erro de conexão com o servidor.';
            });
        }

        function registrar() {
            var nome = document.getElementById('regNome').value.trim();
            var cpf = document.getElementById('regCpf').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var senha = document.getElementById('regSenha').value.trim();
            var confirma = document.getElementById('regConfirma').value.trim();
            var chavePix = document.getElementById('regChavePix').value.trim();
            var errEl = document.getElementById('regError');

            if (!nome || !cpf || !email || !senha || !confirma || !chavePix) {
                errEl.textContent = 'Preencha todos os campos.';
                return;
            }
            var cpfLimpo = cpf.replace(/\D/g, '');
            if (!validarCPF(cpfLimpo)) {
                errEl.textContent = 'CPF inválido.';
                return;
            }
            if (senha.length < 4) {
                errEl.textContent = 'Senha deve ter no mínimo 4 caracteres.';
                return;
            }
            if (senha !== confirma) {
                errEl.textContent = 'Senhas não conferem.';
                return;
            }

            fetch((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : 'https://bingo-master-pro-fcty.onrender.com') + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomeCompleto: nome, cpf: cpfLimpo, email: email, senha: senha, chavePix: chavePix })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.error) {
                    errEl.textContent = data.error;
                    return;
                }
                localStorage.setItem('bingo_session_token', data.sessionToken);
                localStorage.setItem('bingo_meu_cpf', data.cpf);
                localStorage.setItem('bingo_last_name', data.nome);
                showToast('Cadastro realizado com sucesso!', 'success');
                errEl.textContent = '';
                setTimeout(function() { window.location.href = 'index.html'; }, 500);
            })
            .catch(function() {
                errEl.textContent = 'Erro de conexão com o servidor.';
            });
        }

        function conectarComoEspectador() {
            showToast('Modo espectador disponível apenas no jogo completo.', 'info');
        }
    </script>
</body>
</html>
