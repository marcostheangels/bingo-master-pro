services:
  - type: web
    name: bingo-master-pro
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: marcostheangels@gmail.com
      - key: ADMIN_EMAIL
        value: marcostheangels@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
